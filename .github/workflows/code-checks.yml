name: Code Checks

on:
  workflow_call:
    secrets:
      SECRETS_JSON:
        required: false
    inputs:
      runOnGithubActions:
        required: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-rules:
    runs-on: ${{ inputs.runOnGithubActions && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2204' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: No AI attribution in the PR or its commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node library/agent/hooks/check-attribution.mjs --text "$TITLE" "$BODY"
          git log --format=%B "$BASE_SHA..HEAD" > "$RUNNER_TEMP/commits.txt"
          node library/agent/hooks/check-attribution.mjs "$RUNNER_TEMP/commits.txt"
      - name: Added comments follow the rule
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node library/agent/hooks/check-comments.mjs
      - uses: pnpm/action-setup@v6
        with:
          run_install: true
          cache: true
          standalone: true
      - name: React Compiler accepts the changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node library/agent/hooks/check-compiler.mjs

  formatting:
    runs-on: ${{ inputs.runOnGithubActions && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2204' }}
    steps:
      - name: Load .env file
        uses: oNaiPs/secrets-to-env-action@v1.5
        with:
          secrets: ${{ secrets.SECRETS_JSON }}
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: true
          cache: true
          standalone: true
      - run: pnpm run lint
        continue-on-error: true
      - run: git status
      - uses: tj-actions/verify-changed-files@v20
        with:
          fail-if-changed: true
          fail-message: 'Looks like there may be auto-fixable linting issues. Run "pnpm lint" to fix them.'
      - run: pnpm run format
      - run: git status
      - uses: tj-actions/verify-changed-files@v20
        with:
          fail-if-changed: true
          fail-message: 'Looks like there may be formatting issues. Run "pnpm format" to fix them.'

  build:
    runs-on: ${{ inputs.runOnGithubActions && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2204' }}
    steps:
      - name: Load .env file
        uses: oNaiPs/secrets-to-env-action@v1.5
        with:
          secrets: ${{ secrets.SECRETS_JSON }}
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
      - uses: useblacksmith/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: true
          cache: true
          standalone: true
      - run: pnpm run lint
      - run: pnpm test
      # running a build will also check types
      - run: pnpm run build
