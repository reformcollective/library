name: Code Checks

on:
  workflow_call:
    secrets:
      SECRETS_JSON:
        required: false
    inputs:
      runOnGithubActions:
        required: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    runs-on: ${{ inputs.runOnGithubActions && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2204' }}
    steps:
      - name: Load .env file
        env:
          SECRETS_JSON: ${{ secrets.SECRETS_JSON }}
        run: |
          # mask every value before exporting it: GitHub only masks the JSON blob as a whole,
          # so each value would otherwise print in plain text in later steps' env.
          # masked line by line so multi-line values (keys, certs) are covered too
          json="${SECRETS_JSON:-}"
          if [ -z "$json" ]; then json='{}'; fi

          echo "$json" | jq -r 'to_entries[] | .value' | while IFS= read -r line; do
            if [ -n "$line" ]; then echo "::add-mask::$line"; fi
          done

          # heredoc syntax keeps multi-line values intact
          echo "$json" | jq -r 'to_entries[] |
            "\(.key)<<__EOF_\(.key)__\n\(.value)\n__EOF_\(.key)__"' >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: true
          cache: true
          standalone: true
      - run: pnpm run lint
        continue-on-error: true
      - run: git status
      - uses: tj-actions/verify-changed-files@v20
        with:
          fail-if-changed: true
          fail-message: 'Looks like there may be auto-fixable linting issues. Run "pnpm lint" to fix them.'
      - run: pnpm run format
      - run: git status
      - uses: tj-actions/verify-changed-files@v20
        with:
          fail-if-changed: true
          fail-message: 'Looks like there may be formatting issues. Run "pnpm format" to fix them.'

  build:
    runs-on: ${{ inputs.runOnGithubActions && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2204' }}
    steps:
      - name: Load .env file
        env:
          SECRETS_JSON: ${{ secrets.SECRETS_JSON }}
        run: |
          # mask every value before exporting it: GitHub only masks the JSON blob as a whole,
          # so each value would otherwise print in plain text in later steps' env.
          # masked line by line so multi-line values (keys, certs) are covered too
          json="${SECRETS_JSON:-}"
          if [ -z "$json" ]; then json='{}'; fi

          echo "$json" | jq -r 'to_entries[] | .value' | while IFS= read -r line; do
            if [ -n "$line" ]; then echo "::add-mask::$line"; fi
          done

          # heredoc syntax keeps multi-line values intact
          echo "$json" | jq -r 'to_entries[] |
            "\(.key)<<__EOF_\(.key)__\n\(.value)\n__EOF_\(.key)__"' >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
      - uses: useblacksmith/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: true
          cache: true
          standalone: true
      - run: pnpm run lint
      - run: pnpm test
      # running a build will also check types
      - run: pnpm run build
