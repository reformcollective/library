name: Code Checks

on:
  workflow_call:
    secrets:
      SECRETS_JSON:
        required: false
    inputs:
      isSanity:
        required: true
        type: boolean
      fetch-lfs:
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Load .env file
        uses: oNaiPs/secrets-to-env-action@v1.5
        with:
          secrets: ${{ secrets.SECRETS_JSON }}
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # optional: enable Git LFS for repositories that store large binaries in LFS
          # input for call is fetch-lfs: true
          lfs: ${{ inputs.fetch-lfs }}
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false
      - name: Ensure Git LFS objects are present (optional)
        if: ${{ inputs.fetch-lfs == true }}
        run: |
          git lfs install --local
          # Attempt to pull LFS objects for the current ref; tolerant to failures
          git lfs pull || true
      - name: Install dependencies
        run: pnpm install || echo 'Looks like your lockfile is out of date. Run "pnpm install" to fix it.'
      - run: pnpm run lint
        continue-on-error: true
      - run: git status
      - uses: tj-actions/verify-changed-files@v20
        with:
          fail-if-changed: true
          fail-message: 'Looks like there may be auto-fixable linting issues. Run "pnpm lint" to fix them.'
      - run: pnpm run format
      - run: git status
      - uses: tj-actions/verify-changed-files@v20
        with:
          fail-if-changed: true
          fail-message: 'Looks like there may be formatting issues. Run "pnpm format" to fix them.'

  build:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Load .env file
        uses: oNaiPs/secrets-to-env-action@v1.5
        with:
          secrets: ${{ secrets.SECRETS_JSON }}
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: ${{ inputs.fetch-lfs }}
      - uses: useblacksmith/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false
      - run: pnpm install
      - run: pnpm run lint
      - if: inputs.isSanity == true
        run: |
          pnpm typegen
          rm -f sanity-all.json && rm -f sanity-all.ndjson

          # Query published documents
          pnpm exec sanity documents query '*[!(_id in path("drafts.**"))]' --api-version='v2022-06-01' >> sanity-all.json

          # Convert to ndjson
          cat sanity-all.json | jq -c '.[]' > sanity-all.ndjson

          # Validate published documents
          pnpm exec sanity documents validate -y --file sanity-all.ndjson
      # running a build will also check types
      - run: pnpm run build
