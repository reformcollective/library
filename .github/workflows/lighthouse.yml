name: Lighthouse
on:
  workflow_call:
    secrets:
      SECRETS_JSON:
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# dont add pages or environment when moving to next starter
# image fix

jobs:
  lighthouse_test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Load .env file
        uses: oNaiPs/secrets-to-env-action@v1.5
        with:
          secrets: ${{ secrets.SECRETS_JSON }}
      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            Lighthouse report is generating
          comment-tag: lighthouse
          github-token: ${{ env.LIGHTHOUSE_PAT }}

      # BEGIN INSTALLATION
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install
      # END INSTALLATION

      - name: Build
        run: pnpm run build

      - name: Serve
        run: pnpm run serve & SERVER_PID=$!

      - name: Run Unlighthouse
        run: pnpm dlx unlighthouse-ci --site http://localhost:3000/ --build-static --output-path ./report

      - name: Deploy preview
        id: deployment
        # don't skip if unlighthouse fails
        if: always()
        # ignore if fails
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./report/
          umbrella-dir: ${{ github.repository }}
          deploy-repository: reformcollective/lighthouse
          token: ${{ env.LIGHTHOUSE_PAT }}

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            Lighthouse report completed!
            [View report](${{ steps.deployment.outputs.deployment-url }})
          comment-tag: lighthouse
          github-token: ${{ env.LIGHTHOUSE_PAT }}
