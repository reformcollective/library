name: Lighthouse
on:
  workflow_call:
    secrets:
      SECRETS_JSON:
        required: false

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# dont add pages or environment when moving to next starter
# image fix

jobs:
  lighthouse:
    timeout-minutes: 15
    runs-on: self-hosted
    steps:
      - name: Load .env file
        uses: oNaiPs/secrets-to-env-action@v1.5
        with:
          secrets: ${{ secrets.SECRETS_JSON }}
      - run: touch .env

      # BEGIN INSTALLATION
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        if: github.event.action != 'closed'
        run: corepack pnpm install
      # END INSTALLATION

      - name: Build
        if: github.event.action != 'closed'
        run: pnpm run build

      - name: kill the process running on port 3000
        if: github.event.action != 'closed'
        run: kill -9 $(lsof -t -i:3000)

      - name: Serve
        if: github.event.action != 'closed'
        run: pnpm run serve & SERVER_PID=$!

      - name: Wait for server...
        if: github.event.action != 'closed'
        run: sleep 5

      - name: Run Unlighthouse
        if: github.event.action != 'closed'
        run: pnpm dlx unlighthouse-ci --site http://localhost:3000/ --router-prefix "/lighthouse/${{ github.repository }}/pr-${{ github.event.pull_request.number }}" --build-static --output-path ./report

      - name: Deploy preview
        id: deployment
        # don't skip if unlighthouse fails
        if: always()
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./report/
          umbrella-dir: ${{ github.repository }}
          deploy-repository: reformcollective/lighthouse
          token: ${{ env.LIGHTHOUSE_PAT }}
