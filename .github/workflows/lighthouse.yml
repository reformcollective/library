name: Lighthouse
on:
  workflow_call:
    secrets:
      SECRETS_JSON:
        required: false

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# dont add pages or environment when moving to next starter
# image fix

jobs:
  lighthouse:
    timeout-minutes: 15
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Load .env file
        uses: oNaiPs/secrets-to-env-action@v1.5
        with:
          secrets: ${{ secrets.SECRETS_JSON }}

      # BEGIN INSTALLATION
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false
      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install
      - uses: useblacksmith/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      # END INSTALLATION
      - name: Build
        if: github.event.action != 'closed'
        run: pnpm run build

      - name: Serve
        if: github.event.action != 'closed'
        run: PORT=3000 pnpm run serve & exit 0

      - name: Wait for server...
        if: github.event.action != 'closed'
        run: sleep 5

      - name: Install unlighthouse-ci
        if: github.event.action != 'closed'
        run: pnpm add unlighthouse-ci

      - name: Run Unlighthouse
        id: unlighthouse
        if: github.event.action != 'closed'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p ./report
          pnpm exec unlighthouse-ci --site http://localhost:3000/ --router-prefix "/lighthouse/${{ github.repository }}/pr-${{ github.event.pull_request.number }}" --build-static --output-path ./report 2> ./report/unlighthouse.stderr | tee ./report/unlighthouse.json
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: kill the server
        # don't skip if unlighthouse fails
        if: always()
        run: kill -9 $(lsof -t -i:3000)
        continue-on-error: true

      - name: Deploy preview
        id: deployment
        # don't skip if unlighthouse fails
        if: always()
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./report/
          umbrella-dir: ${{ github.repository }}
          deploy-repository: reformcollective/lighthouse
          token: ${{ env.LIGHTHOUSE_PAT }}

      - name: Determine Lighthouse result
        if: always()
        run: |
          EXIT_CODE="${{ steps.unlighthouse.outputs.exit_code }}"
          if [ -z "$EXIT_CODE" ]; then
            EXIT_CODE=1
          fi

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "Unlighthouse passed thresholds."
            exit 0
          fi

          if [ -s ./report/unlighthouse.json ] && node -e "JSON.parse(require('fs').readFileSync('./report/unlighthouse.json','utf8'))" 2>/dev/null; then
            echo "Unlighthouse completed but budget thresholds not met. Marking neutral."
            exit 78
          fi

          echo "Unlighthouse crashed or did not produce valid report. Failing."
          test -f ./report/unlighthouse.stderr && tail -n 200 ./report/unlighthouse.stderr || true
          exit 1
