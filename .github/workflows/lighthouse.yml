name: Lighthouse
on:
  workflow_call:
    secrets:
      SECRETS_JSON:
        required: false
    inputs:
      runOnGithubActions:
        required: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# dont add pages or environment when moving to next starter
# image fix

jobs:
  run:
    timeout-minutes: 15
    runs-on: ${{ inputs.runOnGithubActions && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2204' }}
    steps:
      # begin installation
      - name: Load .env file
        uses: oNaiPs/secrets-to-env-action@v1.5
        with:
          secrets: ${{ secrets.SECRETS_JSON }}
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          cache: true
      - name: Mount node_modules
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-node-modules
          path: ./node_modules
      - name: Mount next cache
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-next-cache
          path: ./.next
      - name: Install dependencies
        run: pnpm install
      # end installation

      - name: Build
        if: github.event.action != 'closed'
        run: pnpm run build

      - name: Serve
        if: github.event.action != 'closed'
        run: PORT=3000 pnpm run serve & exit 0

      - name: Wait for server...
        if: github.event.action != 'closed'
        run: sleep 5

      - name: Run Unlighthouse
        id: unlighthouse
        if: github.event.action != 'closed'
        continue-on-error: true
        run: pnpm exec unlighthouse-ci --site http://localhost:3000/ --router-prefix "/lighthouse/${{ github.repository }}/pr-${{ github.event.pull_request.number }}" --build-static --output-path ./report

      - name: kill the server
        # don't skip if unlighthouse fails
        if: always()
        run: kill -9 $(lsof -t -i:3000)
        continue-on-error: true

      - name: Determine Lighthouse conclusion
        id: determine_conclusion
        if: always()
        run: |
          if [ "${UNLIGHTHOUSE_OUTCOME}" = "failure" ]; then
            echo "result=neutral" >> "$GITHUB_OUTPUT"
          else
            echo "result=success" >> "$GITHUB_OUTPUT"
          fi
        env:
          UNLIGHTHOUSE_OUTCOME: ${{ steps.unlighthouse.outcome }}

      - name: Determine Lighthouse check name
        id: determine_check_name
        if: always()
        run: |
          if [ "${UNLIGHTHOUSE_OUTCOME}" = "failure" ]; then
            echo "value=Lighthouse Failed" >> "$GITHUB_OUTPUT"
          else
            echo "value=Lighthouse Passed" >> "$GITHUB_OUTPUT"
          fi
        env:
          UNLIGHTHOUSE_OUTCOME: ${{ steps.unlighthouse.outcome }}

      - name: Deploy preview
        id: deployment
        # don't skip if unlighthouse fails
        if: always()
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./report/
          umbrella-dir: ${{ github.repository }}
          deploy-repository: reformcollective/lighthouse
          token: ${{ env.LIGHTHOUSE_PAT }}

      - uses: LouisBrunner/checks-action@v2.0.0
        # don't skip if unlighthouse fails
        if: always()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.determine_check_name.outputs.value }}
          conclusion: ${{ steps.determine_conclusion.outputs.result }}
          output: |
            {"summary":"summary goes here"}
