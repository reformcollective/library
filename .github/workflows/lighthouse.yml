name: Lighthouse
on:
  workflow_call:
    secrets:
      SECRETS_JSON:
        required: false

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# dont add pages or environment when moving to next starter
# image fix

jobs:
  lighthouse:
    timeout-minutes: 15
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Load .env file
        uses: oNaiPs/secrets-to-env-action@v1.5
        with:
          secrets: ${{ secrets.SECRETS_JSON }}

      # BEGIN INSTALLATION
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false
      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install
      - uses: useblacksmith/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      # END INSTALLATION
      - name: Build
        if: github.event.action != 'closed'
        run: pnpm run build

      - name: Serve
        if: github.event.action != 'closed'
        run: PORT=3000 pnpm run serve & exit 0

      - name: Wait for server...
        if: github.event.action != 'closed'
        run: sleep 5

      - name: Run Unlighthouse
        if: github.event.action != 'closed'
        run: pnpm exec unlighthouse --site http://localhost:3000/ --router-prefix "/lighthouse/${{ github.repository }}/pr-${{ github.event.pull_request.number }}" --build-static --output-path ./report

      - name: kill the server
        # don't skip if unlighthouse fails
        if: always()
        run: kill -9 $(lsof -t -i:3000)
        continue-on-error: true

      - name: Deploy preview
        id: deployment
        # don't skip if unlighthouse fails
        if: always()
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./report/
          umbrella-dir: ${{ github.repository }}
          deploy-repository: reformcollective/lighthouse
          token: ${{ env.LIGHTHOUSE_PAT }}
