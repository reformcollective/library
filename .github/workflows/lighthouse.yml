name: Lighthouse
on:
  workflow_call:
    secrets:
      SECRETS_JSON:
        required: false
    inputs:
      runOnGithubActions:
        required: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# dont add pages or environment when moving to next starter
# image fix

jobs:
  run:
    timeout-minutes: 15
    runs-on: ${{ inputs.runOnGithubActions && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2204' }}
    steps:
      - name: Load .env file
        env:
          SECRETS_JSON: ${{ secrets.SECRETS_JSON }}
        run: |
          # mask every value before exporting it: GitHub only masks the JSON blob as a whole,
          # so each value would otherwise print in plain text in later steps' env.
          # masked line by line so multi-line values (keys, certs) are covered too
          json="${SECRETS_JSON:-}"
          if [ -z "$json" ]; then json='{}'; fi

          echo "$json" | jq -r 'to_entries[] | .value' | while IFS= read -r line; do
            if [ -n "$line" ]; then echo "::add-mask::$line"; fi
          done

          # heredoc syntax keeps multi-line values intact
          echo "$json" | jq -r 'to_entries[] |
            "\(.key)<<__EOF_\(.key)__\n\(.value)\n__EOF_\(.key)__"' >> "$GITHUB_ENV"

      # BEGIN INSTALLATION
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: true
          cache: true
          standalone: true
      - uses: useblacksmith/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      # END INSTALLATION
      - name: Build
        if: github.event.action != 'closed'
        run: pnpm run build

      - name: Serve
        if: github.event.action != 'closed'
        run: PORT=3000 pnpm run serve & exit 0

      - name: Wait for server...
        if: github.event.action != 'closed'
        run: sleep 5

      - name: Run Unlighthouse
        id: unlighthouse
        if: github.event.action != 'closed'
        continue-on-error: true
        run: pnpm exec unlighthouse-ci --site http://localhost:3000/ --router-prefix "/lighthouse/${{ github.repository }}/pr-${{ github.event.pull_request.number }}" --build-static --output-path ./report

      - name: kill the server
        # don't skip if unlighthouse fails
        if: always()
        run: kill -9 $(lsof -t -i:3000)
        continue-on-error: true

      - name: Determine Lighthouse conclusion
        id: determine_conclusion
        if: always()
        run: |
          if [ "${UNLIGHTHOUSE_OUTCOME}" = "failure" ]; then
            echo "result=neutral" >> "$GITHUB_OUTPUT"
          else
            echo "result=success" >> "$GITHUB_OUTPUT"
          fi
        env:
          UNLIGHTHOUSE_OUTCOME: ${{ steps.unlighthouse.outcome }}

      - name: Determine Lighthouse check name
        id: determine_check_name
        if: always()
        run: |
          if [ "${UNLIGHTHOUSE_OUTCOME}" = "failure" ]; then
            echo "value=Lighthouse Failed" >> "$GITHUB_OUTPUT"
          else
            echo "value=Lighthouse Passed" >> "$GITHUB_OUTPUT"
          fi
        env:
          UNLIGHTHOUSE_OUTCOME: ${{ steps.unlighthouse.outcome }}

      - name: Deploy preview
        id: deployment
        # don't skip if unlighthouse fails
        if: always()
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./report/
          umbrella-dir: ${{ github.repository }}
          deploy-repository: reformcollective/lighthouse
          token: ${{ env.LIGHTHOUSE_PAT }}

      - uses: LouisBrunner/checks-action@v2.0.0
        # don't skip if unlighthouse fails
        if: always()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.determine_check_name.outputs.value }}
          conclusion: ${{ steps.determine_conclusion.outputs.result }}
          output: |
            {"summary":"summary goes here"}
