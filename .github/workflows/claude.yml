name: Claude Code

on:
  workflow_call:
    secrets:
      SECRETS_JSON:
        required: false

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - name: Load .env file
        env:
          SECRETS_JSON: ${{ secrets.SECRETS_JSON }}
        run: |
          # mask every value before exporting it: GitHub only masks the JSON blob as a whole,
          # so each value would otherwise print in plain text in later steps' env.
          # masked line by line so multi-line values (keys, certs) are covered too
          json="${SECRETS_JSON:-}"
          if [ -z "$json" ]; then json='{}'; fi

          echo "$json" | jq -r 'to_entries[] | .value' | while IFS= read -r line; do
            if [ -n "$line" ]; then echo "::add-mask::$line"; fi
          done

          # heredoc syntax keeps multi-line values intact
          echo "$json" | jq -r 'to_entries[] |
            "\(.key)<<__EOF_\(.key)__\n\(.value)\n__EOF_\(.key)__"' >> "$GITHUB_ENV"

      - name: Resolve checkout target
        id: checkout-target
        uses: actions/github-script@v8
        with:
          script: |
            const defaultRepository = `${context.repo.owner}/${context.repo.repo}`
            let pullRequest = context.payload.pull_request ?? null

            if (!pullRequest && context.payload.issue?.pull_request) {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.issue.number,
              })
              pullRequest = response.data
            }

            if (!pullRequest) {
              core.setOutput("repository", defaultRepository)
              core.setOutput("ref", context.ref.replace("refs/heads/", ""))
              return
            }

            const headRepository = pullRequest.head.repo?.full_name
            const headRef = pullRequest.head.ref

            if (!headRepository || headRepository !== defaultRepository) {
              core.setFailed("Claude ping workflow only supports pull requests from branches in this repository.")
              return
            }

            core.setOutput("repository", headRepository)
            core.setOutput("ref", headRef)

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.checkout-target.outputs.repository }}
          ref: ${{ steps.checkout-target.outputs.ref }}
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          claude_args: >-
            --dangerously-skip-permissions
            --allowedTools "mcp__github__*"
